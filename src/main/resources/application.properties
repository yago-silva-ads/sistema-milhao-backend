# SISTEMA MILHAO - Backend (Produção)

# MySQL (Aiven Cloud - Free)
spring.datasource.url=jdbc:mysql://sistema-milhao-db-sistema-milhao.e.aivencloud.com:21859/defaultdb?useSSL=true&sslMode=REQUIRED&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DATABASE_USER:avnadmin}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:bxtnaldo0z@gmail.com}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Mercado Pago
mercadopago.access-token=${MP_ACCESS_TOKEN:}

# Server
server.port=${PORT:8080}
